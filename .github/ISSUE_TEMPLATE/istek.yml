name: Özellik isteği
description: Yeni bir özellik ya da iyileştirme önerisi
labels: [iyileştirme]
body:
  - type: textarea
    id: ihtiyac
    attributes:
      label: İhtiyaç
      description: Hangi sorunu çözecek? Sahada / testte nerede eksikliği hissedildi?
    validations:
      required: true
  - type: textarea
    id: oneri
    attributes:
      label: Önerilen çözüm
  - type: textarea
    id: etki
    attributes:
      label: Kimleri etkiler?
      description: Ortak zemindeki (mesajlar, sürücüler, araç katmanı) değişiklikler tüm sürüş yöntemlerini etkiler.
