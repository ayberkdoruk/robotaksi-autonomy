name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ROS 2 Jazzy · Ubuntu 24.04
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Bağımlılıkları kur
        run: |
          apt-get update
          rosdep update --rosdistro jazzy
          # rslidar_sdk dış depodur (robotaksi.repos); CI'da derlenmez, çalışma zamanı bağımlılığıdır.
          rosdep install --from-paths src --ignore-src -y --rosdistro jazzy \
            --dependency-types build --dependency-types buildtool \
            --dependency-types build_export --dependency-types buildtool_export \
            --skip-keys "rslidar_sdk rslidar_msg"

      - name: Derle
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+ \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Python sözdizimi kontrolü
        run: python3 -m compileall -q src/araclar/kontrol_merkezi/scripts src/arac/arac_haberlesme/scripts
